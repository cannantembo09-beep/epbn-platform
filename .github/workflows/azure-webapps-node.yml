-CI/CD Validation Criteria

A deployment is considered successful only when all of the following
criteria are satisfied:

Build Validation
✓ Repository checkout completes successfully
✓ Node.js environment is provisioned successfully
✓ npm ci completes without errors
✓ Application dependencies resolve successfully
✓ Build process exits with status code 0
✓ Build artifacts are generated and uploaded

Code Quality Validation
✓ No critical build failures detected
✓ No unresolved dependency installation errors
✓ Workflow syntax validation passes
✓ Artifact packaging completes successfully

Staging Deployment Validation
✓ Deployment to staging slot completes successfully
✓ Deployment artifacts are extracted correctly
✓ Application startup completes within expected timeframe
✓ Staging environment becomes accessible

Staging Health Validation
✓ Health endpoint returns HTTP 200
✓ Health response contains expected service status
✓ Application responds within acceptable latency thresholds
✓ Critical application routes are reachable
✓ No critical runtime exceptions detected

Production Release Validation
✓ Promotion requires successful staging validation
✓ Production deployment completes successfully
✓ Application becomes available after deployment
✓ Deployment logs show no critical errors

Production Health Validation
✓ Health endpoint returns HTTP 200
✓ Core business functionality is operational
✓ Static assets load correctly
✓ API endpoints respond successfully
✓ No critical application failures observed

Rollback Validation Criteria
✓ Rollback workflow triggers automatically after failed production validation
✓ Rollback execution status reports successful completion
✓ Previous stable deployment remains available
✓ Health endpoint returns HTTP 200 after rollback
✓ Application functionality is restored to pre-deployment state
✓ Rollback logs confirm successful deployment reversal
✓ Recovery time remains within defined operational targets

Pipeline Success Criteria
✓ Build succeeds
✓ Staging deployment succeeds
✓ Staging health checks succeed
✓ Production deployment succeeds
✓ Production health checks succeed
✓ No rollback actions required
✓ Workflow completes with successful status

Pipeline Failure Criteria
✗ Build failure
✗ Dependency installation failure
✗ Artifact upload failure
✗ Staging deployment failure
✗ Staging health check failure
✗ Production deployment failure
✗ Production health check failure
✗ Rollback execution failure

Manual Verification Steps

Environment Preparation
1. Verify Azure App Service is available
2. Verify staging slot exists and is running
3. Verify production slot is operational
4. Confirm deployment secrets are configured
5. Confirm GitHub environments are configured correctly

Pre-Release Verification
1. Review workflow run configuration
2. Validate repository permissions
3. Confirm environment protection rules
4. Verify build configuration values
5. Review deployment parameters before execution

Staging Verification
1. Navigate to the staging environment URL
2. Confirm application loads successfully
3. Verify login and authentication flows
4. Validate key business workflows
5. Review Azure App Service logs
6. Verify monitoring data is reporting normally
7. Execute health endpoint checks manually

Example:

curl https://staging.epbn.com/health

Expected Response:

{
  "status": "healthy",
  "service": "epbn-platform"
}

Production Verification
1. Confirm production deployment completed
2. Access production application in browser
3. Validate critical user journeys
4. Verify API functionality
5. Review application and deployment logs
6. Confirm monitoring and alerts remain healthy
7. Execute health endpoint verification
8. Confirm expected application version is running

Rollback Verification Steps
1. Simulate health check failure in a test deployment
2. Confirm rollback workflow is triggered automatically
3. Verify rollback job execution logs
4. Confirm deployment slot swap completes successfully
5. Access application after rollback execution
6. Verify previous stable version is restored
7. Confirm health endpoint returns HTTP 200
8. Validate critical business workflows after rollback
9. Review Azure deployment history for rollback confirmation
10. Confirm no customer-facing downtime occurred during recovery

Rollback Success Criteria
✓ Previous release restored successfully
✓ Health endpoint reports healthy status
✓ Application remains accessible
✓ Critical workflows function normally
✓ Production traffic is routed to stable deployment
✓ No unresolved deployment errors remain

Post-Deployment Review
1. Review GitHub Actions execution logs
2. Review Azure deployment logs
3. Validate monitoring dashboards
4. Check error reporting systems
5. Confirm application performance metrics remain stable
6. Document any deployment observations or anomalies

Final Release Approval Criteria
✓ All automated tests passed
✓ All health checks passed
✓ Manual verification completed
✓ Monitoring shows healthy service state
✓ No unresolved deployment issues
✓ Rollback procedure validated and available
✓ Production environment confirmed operational
