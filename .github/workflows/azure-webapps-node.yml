feat(ci/cd): add staging deployment, health checks, and rollback workflow
feat(deployment): introduce staged Azure releases with automated validation and rollback
feat(ci/cd): implement staged Azure deployment pipeline with health validation and rollback controls

Introduce a production-ready CI/CD workflow for Azure App Service that
improves deployment reliability, reduces release risk, and establishes
a foundation for continuous delivery across EPBN environments.

Changes included:

Deployment Architecture
- Add dedicated build, staging, validation, and production deployment stages
- Separate artifact creation from deployment execution
- Enable promotion of validated build artifacts between environments
- Establish clear deployment flow from staging to production

Staging Environment
- Deploy all releases to a staging slot before production rollout
- Configure environment-specific deployment settings
- Isolate staging deployment credentials from production credentials
- Create a safe environment for release verification

Health Monitoring
- Add automated health checks against application endpoints
- Validate service availability before promoting releases
- Verify production health after deployment completion
- Introduce retry logic to accommodate application startup times
- Fail deployments automatically when health validation is unsuccessful

Rollback and Recovery
- Add rollback workflow triggered by failed production validation
- Prepare Azure deployment slot swap strategy for rapid recovery
- Reduce service disruption during failed releases
- Establish foundation for automated rollback procedures

Performance Improvements
- Enable npm dependency caching
- Optimize build execution time across workflow runs
- Improve artifact-based deployment efficiency
- Reduce redundant package installations

Security Enhancements
- Separate staging and production deployment secrets
- Apply least-privilege workflow permissions
- Support future migration to Azure OpenID Connect (OIDC)
- Improve deployment credential management practices

Operational Controls
- Add concurrency protection to prevent overlapping deployments
- Cancel superseded workflow executions during active releases
- Improve deployment consistency and environment stability
- Strengthen release governance through environment separation

Benefits
- Safer production releases
- Reduced deployment downtime
- Faster issue detection
- Improved recovery capabilities
- Higher deployment confidence
- Production-ready Azure deployment foundation

Deployment Flow

Build
  ↓
Deploy to Staging
  ↓
Run Health Checks
  ↓
Deploy to Production
  ↓
Verify Production Health
  ↓
Rollback on Failure

This change establishes a scalable CI/CD foundation aligned with
enterprise deployment practices and prepares the EPBN Platform for
reliable production operations.
